<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <h1> Create Account</h1>
            <p class="subtitle">
                Join Project Management System
            </p>
            <form  id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" placeholder="Enter your Full Name:" required> 
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Enter your Email:" required>
                </div>
                <div class="form-group">
                    <label for="role"> Select Role:</label>
                    <select id="role" required>
                        <option value="">--select role--</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <div class="form-group" id="rollnogroup">
                    <label for="rollno">Roll Number:</label>
                    <input type="text" id="rollno" placeholder="Enter your Roll No:">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>
                    <input type="password" id="confirmPassword" placeholder="confirm your password" required>
                </div>
                <button type="submit">
                    Register
                </button>
            </form>
            <p class="login-text">Already have an account? <a href="login.html"> Login</a></p>
        </div>

    </div>
    <script>
        const role=document.getElementById("role");
        const rollnogroup=document.getElementById("rollnogroup");
        rollnogroup.style.display="none";
        role.addEventListener("change",function(){
            if(role.value==="student"){
                rollnogroup.style.display="block";
            }else{
                rollnogroup.style.display="none";
            }
        });
    </script>
    
</body>
</html>
