<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap icons Link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Toastify link for toast notifications -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <title>Organization - Student</title>
</head>

<body>

    <nav class="navbar p-3 border-bottom bg-white sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <a href="student-dashboard.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <div>
                <button id="logoutBtn" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="row g-4">
            
            <div class="col-12 col-lg-6">
                <div id="loadingIndicator" class="text-center py-4 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                    Loading project details...
                </div>

                <div id="createProjectCard" class="card shadow-sm border-0 rounded-3 p-4 d-none">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <h4 class="fw-bold m-0">Create a Project</h4>
                    </div>

                    <form id="createProjectForm">
                        <div class="mb-3">
                            <label for="projectTitle" class="form-label fw-semibold">
                                Project Title
                            </label>
                            <input type="text" class="form-control" id="projectTitle" placeholder="e.g. AI-Powered Attendance System" required>
                        </div>
                        <div class="mb-3">
                            <label for="groupName" class="form-label fw-semibold">
                                Group Name
                            </label>
                            <input type="text" class="form-control" id="groupName" placeholder="e.g. Tech Innovators" required>
                        </div>
                        <div class="mb-3">
                            <label for="projectDesc" class="form-label fw-semibold">
                                Project Description
                            </label>
                            <textarea class="form-control" id="projectDesc" rows="3" placeholder="Briefly describe your project objective and technologies..."></textarea>
                        </div>
                        <button type="submit" id="createProjectBtn" class="btn btn-primary w-100 fw-semibold">
                         Create Project
                        </button>
                    </form>
                </div>

                <div id="projectDetailsCard" class="card shadow-sm border-0 rounded-3 p-4 d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold m-0" id="displayProjectTitle">Project Title</h4>
                        <button id="inviteMembersBtn" class="btn btn-outline-primary btn-sm d-none">
                            Invite Members
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-semibold">Group Name</label>
                        <p class="fw-semibold m-0" id="displayGroupName"></p>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-semibold">Description</label>
                        <p class="text-muted small m-0" id="displayProjectDesc"></p>
                    </div>
                    <div class="mb-0">
                        <label class="text-muted small fw-semibold mb-2">Members</label>
                        <div id="projectMembersList" class="d-flex flex-column gap-2">
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>


    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Toastify JS -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/organization.js"></script>
</body>

</html>
