<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Student Dashboard</title>
</head>

<body>
    <nav class="navbar p-3 border-bottom">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h3 class="m-0">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i>Student Dashboard
            </h3>

            <div class="d-flex align-items-center gap-3">
                <span class="text-muted" id="studentNameDisplay">
                    <i class="bi bi-person-circle me-1"></i> Student
                </span>
                <button id="logoutBtn" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="mb-4">
            <h2>Welcome <span id="welcomename">👋</span></h2>
        </div>

        <section id="joinOrgSection" class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border rounded-3 p-4 text-center">
                    <div class="mb-3">
                        <i class="bi bi-buildings text-primary display-4"></i>
                    </div>
                    <h4 class="card-title fw-bold">Join an Organization</h4>
                    <p class="text-muted small">Enter the code provided by your teacher to connect to your project batch.</p>
                    <form id="joinOrgForm" class="mt-3">
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-lg text-center fw-bold letter-spacing" id="orgCode" placeholder="e.g. 4829" maxlength="6" required>
                        </div>
                        <button type="submit" id="joinBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Join Organization
                        </button>
                    </form>
                    <div class="mt-3 text-muted small">
                        <i class="bi bi-info-circle me-1"></i> Don't have a code? Contact your project guide.
                    </div>
                </div>
            </div>
        </section>

        <section id="organizationSection" class="d-none mt-3">
            <div class="card shadow-sm border rounded-3 p-4">
                <h4 class="mb-2">Your Organization</h4>
                <p class="text-muted mb-0">Details will appear here after joining an organization.</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/student-dashboard.js"></script>
</body>

</html>
