<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Vootstrap CSS link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap icons Link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Toastify link for toast notifications -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Student Dashboard</title>
</head>

<body>
    <nav class="navbar p-3 border-bottom">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h3 class="m-0">
                Student Dashboard
            </h3>

            <div class="d-flex align-items-center gap-3">
                <span class="text-muted" id="studentNameDisplay">
                    <i class="bi bi-person-circle me-1"></i>
                    Student
                </span>
                <button id="logoutBtn" class="btn btn-danger">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="mb-4">
            <h2>Welcome <span id="welcomename">👋</span></h2>
        </div>

        <section id="joinOrgSection" class="row justify-content-start">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border rounded-3 p-4 text-center">
                    <h4 class="card-title fw-bold">Join an Organization</h4>
                    <p class="text-muted small">Enter the code provided by your teacher.</p>
                    <form id="joinOrgForm" class="mt-3">
                        <div class="mb-3">
                            <input type="text" inputmode="numeric" class="form-control text-center fw-bold" id="orgCode" placeholder="e.g. 4829" maxlength="4" pattern="[0-9]{4}" title="Please enter a 4-digit code (0-9)" required> <!--  strict 4 digit numeric validation -->
                        </div>
                        <button type="submit" id="joinBtn" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Join Organization
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <section id="organizationSection" class="mt-3">
            <div class="card shadow-sm border rounded-3 p-4">
                <h4 class="mb-2">Your Organization</h4>
                <p class="text-muted mb-0">Details will appear here after joining an organization.</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/student-dashboard.js"></script>
</body>

</html>
