<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>organization overviewt</title>
    
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/teacher-organization.css">
</head>

<body>
    <nav class="topbar">
        <a class="brand" href="teacher-dashboard.html">
            <i class="bi bi-mortarboard-fill"></i>
            <span>Project Desk</span>
        </a>
        <div class="topbar-actions">
            <a class="back-link" href="teacher-dashboard.html">
                <i class="bi bi-arrow-left"></i>
                Organizations
            </a>
            <button id="logoutBtn" class="logout-button" type="button" title="Log out">
                <i class="bi bi-box-arrow-right"></i>
                <span>Log out</span>
            </button>
        </div>
    </nav>
    <main class="page-shell">
        <div id="loadingState" class="state-message">
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            Loading organization...
        </div>

        <div id="errorState" class="state-message error-message d-none" role="alert"></div>

        <div id="organizationPage" class="d-none">
            <header class="organization-header">
                <div>
                    <p class="eyebrow">TEACHER WORKSPACE</p>
                    <h1 id="organizationName">Organization</h1>
                    <p id="organizationMeta" class="organization-meta"></p>
                    <p id="organizationDescription" class="organization-description"></p>
                </div>
                <div class="join-code">
                    <span>STUDENT JOIN CODE</span>
                    <strong id="organizationCode">----</strong>
                </div>
            </header>

            <section class="stats-grid" aria-label="Organization statistics">
                <article class="stat-panel">
                    <span class="stat-icon students-icon"><i class="bi bi-people"></i></span>
                    <div>
                        <p>Joined students</p>
                        <strong id="studentCount">0</strong>
                    </div>
                </article>
                <article class="stat-panel">
                    <span class="stat-icon groups-icon"><i class="bi bi-diagram-3"></i></span>
                    <div>
                        <p>Project groups</p>
                        <strong id="groupCount">0</strong>
                    </div>
                </article>
                <article class="stat-panel">
                    <span class="stat-icon unassigned-icon"><i class="bi bi-person-dash"></i></span>
                    <div>
                        <p>Not in a group</p>
                        <strong id="unassignedCount">0</strong>
                    </div>
                </article>
            </section>

            <section class="content-section">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">PROJECT TEAMS</p>
                        <h2>Groups</h2>
                    </div>
                    <span id="groupsLabel" class="section-count">0 groups</span>
                </div>
                <div id="groupsList" class="groups-grid"></div>
            </section>

            <section class="content-section">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">ORGANIZATION ROSTER</p>
                        <h2>Students</h2>
                    </div>
                    <span id="studentsLabel" class="section-count">0 students</span>
                </div>

                <div class="table-wrap">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Roll number</th>
                                <th>Group</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/teacher-organization.js"></script>
</body>

</html>
