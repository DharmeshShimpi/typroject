<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- bootstrap css link -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> <!-- bootstrap icons link -->
</head>
<body>

    <!-- nav bar for teacher dashboard -->
    <nav class="navbar p-3 border-bottom"> <!-- p-3 means padding 16px -->
        <h3>Teacher Dashboard</h3>

        <button id="logoutBtn" class="btn btn-danger"> 
            <!-- NOTE: logout button id="logoutBtn" -->
            Logout
        </button>
    </nav>

    <!-- main dashboard body -->
    <main>
        
        <!-- greetings -->
        <div class="p-3">
            <h2>
                Welcome 👋
            </h2>
            <p class="text-muted">
                Manage your organizations.
            </p>
        </div>

        <!-- Create organization card -->
        <div class="p-3 mb-3">
            <h4>
               Create a New Organization
            </h4>
            <p class="text-muted">
                Create a New Organization. Setup member limits, and more...
            </p>
            <button class="btn btn-primary" id="createOrg" 
            data-bs-toggle="modal" data-bs-target="#createOrgModal"> <!-- bootstrap code to create a modal window -->
                <i class="bi bi-plus-circle me-2"></i>
                Create Organization
                <!-- + icon with rounded borders -->
            </button>
        </div>

        <!-- heading -->
        <div class="p-3 d-flex">
            <h4 class="me-3 mb-0">
                Your Organizations
            </h4>
        </div>

        <!-- empty state -->
        <div class="px-3">
            <div class="p-3 card bg-light text-muted d-flex justify-content-center align-items-center">
            <h5>
                No organizations created!
            </h5>
            <p class="text-muted">
                You haven't created any organisations yet. Create one to invite students.
            </p>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createOrgModal">
                <i class="bi bi-plus-circle me-2"></i>Create Your First Organization
            </button>
            </div>
        </div>

    </main>


    <!-- create organization modal -->
     <div class="modal fade" id="createOrgModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-3 shadow">

                <!-- modal header -->
                <div class="modal-header">
                    <h1 class="modal-title fs-5 fw-bold">
                        Create Organization
                    </h1>
                    <button class="btn-close" type="button" data-bs-dismiss="modal">   
                    </button>
                </div>
                <!-- modal header end -->

                <!-- modal body -->
                 <form id="createOrgForm">
                    <div class="modal-body py-3">

                        <!-- org name -->
                        <div class="mb-3">
                            <label for="orgName" class="form-label">
                                Organization Name
                            </label>
                            <input type="text" class="form-control" id="orgName" placeholder="e.g. Final Year Project 2026" required>
                        </div>

                    <!-- org desc -->
                    <div class="mb-3">
                        <label for="orgDesc" class="form-label">Description</label>
                        <textarea class="form-control" id="orgDesc" rows="2" placeholder="Brief details about this project batch..."></textarea>
                    </div>

                    <!-- academic year -->
                     <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="orgYear" class="form-label fw-semibold">Academic Year</label>
              <select class="form-select" id="orgYear" required>
                <option value="">-- Select --</option>
                <option value="SY">Second Year (SY)</option>
                <option value="TY">Third Year (TY)</option>
              </select>
            </div>
            <div class="col-6">
              <label for="orgDept" class="form-label fw-semibold">Department</label>
              <select class="form-select" id="orgDept" required>
                <option value="">-- Select --</option>
                <option value="BCS">BCS</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc CS">B.Sc CS</option>
                <option value="B.Tech">B.Tech</option>
              </select>
            </div>
          </div>
          <!-- Member Limits (Side-by-side) -->
          <div class="row g-2">
            <div class="col-6">
              <label for="minMembers" class="form-label fw-semibold">Min Members</label>
              <input type="number" class="form-control" id="minMembers" min="1" max="10" value="2" required>
            </div>
            <div class="col-6">
              <label for="maxMembers" class="form-label fw-semibold">Max Members</label>
              <input type="number" class="form-control" id="maxMembers" min="1" max="10" value="4" required>
            </div>
          </div>
        </div>
        <!-- 3. Modal Footer -->
        <div class="modal-footer border-top-0 pt-0">
          <button type="button" class="btn btn-light text-muted" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Create</button>
        </div>

                 </form>
            </div>
        </div>
     </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- bootstrap JS link  -->
</body>
</html>
